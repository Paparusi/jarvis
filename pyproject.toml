[project]
name = "jarvis"
version = "2.0.0-alpha.1"
description = "JARVIS v2 — Self-evolving AI Agent with Brain Independence"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Gateway & Async
    "websockets>=14.0",
    "uvloop>=0.21.0; sys_platform != 'win32'",
    "pydantic>=2.0",

    # LLM Integration
    "litellm>=1.50.0",

    # Database
    "asyncpg>=0.30.0",
    "redis>=5.0",

    # Channel Adapters
    "python-telegram-bot>=21.0",
    "aiohttp>=3.10",

    # Utilities
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "uuid7>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
training = [
    "unsloth>=2024.0",
    "trl>=0.12",
    "datasets>=3.0",
    "wandb>=0.18",
]

[project.scripts]
jarvis = "src.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
