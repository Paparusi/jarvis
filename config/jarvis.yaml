# === JARVIS v2 Main Configuration ===

gateway:
  host: "127.0.0.1"
  port: 18789
  max_sessions: 100

# Lane Queue
queue:
  default_mode: "serial"        # serial | parallel
  max_queue_size: 1000
  task_timeout_seconds: 120

# Intelligence Layer
intelligence:
  default_model: "claude-sonnet-4-20250514"
  fallback_model: "claude-sonnet-4-20250514"
  max_tokens: 4096
  temperature: 0.7

  # LLM Router — 3-tier: cache → local → cloud
  router:
    enabled: true                # Enabled — local-first, cloud fallback
    local_model: "ollama/jarvis-brain"        # Fine-tuned JARVIS brain (Qwen3.5-4B SFT)
    local_model_strong: "ollama/qwen3:30b-a3b"  # Strong MoE model for medium queries
    cache:
      similarity_threshold: 0.92  # Cosine similarity để match cache
      ttl_seconds: 86400          # Cache expire sau 24h

# Memory (Phase 2+)
memory:
  working:
    max_tokens: 8192
  semantic:
    embedding_model: "text-embedding-3-small"
    embedding_dimensions: 1536
    similarity_threshold: 0.75
  episodic:
    max_episodes: 10000

# Skills
skills:
  load:
    watch: true
    watch_debounce_ms: 250
    dirs:
      - "workspace/skills"
  routing:
    similarity_threshold: 0.7
    max_skills_per_request: 3

# Brain Independence (Phase A starts day 1)
brain:
  data_collection:
    enabled: true
    log_all_interactions: true
    log_tool_calls: true
    log_confidence_scores: true

# Channels
channels:
  cli:
    enabled: true
  telegram:
    enabled: false
    owner_id: 1991690969       # Bi — only owner can interact
  web:
    enabled: false

# Dreamtime (Phase 7+)
dreamtime:
  enabled: true
  schedule_cron: "0 2 * * *"     # 2:00 AM daily
  idle_trigger_minutes: 30
