<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --bg2: #12121a;
            --bg3: #1a1a2e;
            --border: #2a2a3e;
            --text: #e0e0e8;
            --text2: #8888a0;
            --accent: #4a9eff;
            --accent2: #3a7ed4;
            --green: #4ade80;
            --red: #f87171;
            --yellow: #fbbf24;
            --code-bg: #1e1e2e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            background: rgba(74, 222, 128, 0.15);
            color: var(--green);
        }

        .header-right {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text2);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .header-btn:hover {
            background: var(--border);
            color: var(--text);
        }

        /* Main chat area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .avatar.jarvis {
            background: linear-gradient(135deg, var(--accent), #a855f7);
        }

        .avatar.user {
            background: var(--bg3);
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
            max-width: 85%;
        }

        .message.user .bubble {
            background: var(--accent2);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .bubble {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .bubble .meta {
            font-size: 11px;
            color: var(--text2);
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bubble .feedback {
            display: inline-flex;
            gap: 4px;
            margin-left: auto;
        }

        .feedback-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.4;
            transition: opacity 0.2s;
            padding: 2px;
        }

        .feedback-btn:hover { opacity: 1; }
        .feedback-btn.active { opacity: 1; }

        /* Markdown rendering */
        .bubble h1, .bubble h2, .bubble h3 {
            margin: 12px 0 6px;
            color: var(--accent);
        }

        .bubble h1 { font-size: 18px; }
        .bubble h2 { font-size: 16px; }
        .bubble h3 { font-size: 14px; }

        .bubble p { margin: 6px 0; }

        .bubble ul, .bubble ol {
            padding-left: 20px;
            margin: 6px 0;
        }

        .bubble li { margin: 3px 0; }

        .bubble code {
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
        }

        .bubble pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            margin: 8px 0;
            position: relative;
        }

        .bubble pre code {
            background: none;
            padding: 0;
            font-size: 13px;
            line-height: 1.5;
        }

        .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text2);
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .copy-btn:hover { color: var(--text); }

        .bubble table {
            border-collapse: collapse;
            margin: 8px 0;
            width: 100%;
        }

        .bubble th, .bubble td {
            border: 1px solid var(--border);
            padding: 6px 10px;
            text-align: left;
            font-size: 13px;
        }

        .bubble th {
            background: var(--bg3);
            font-weight: 600;
        }

        .bubble strong { color: var(--accent); }

        .bubble a {
            color: var(--accent);
            text-decoration: none;
        }

        .bubble a:hover { text-decoration: underline; }

        .bubble blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 12px;
            color: var(--text2);
            margin: 8px 0;
        }

        /* Tools indicator */
        .tools-used {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .tool-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(74, 158, 255, 0.1);
            color: var(--accent);
            border: 1px solid rgba(74, 158, 255, 0.2);
        }

        /* Thinking indicator */
        .thinking {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text2);
            font-size: 13px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 0 44px;
        }

        .thinking-dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: dot 1.4s infinite ease-in-out;
        }

        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dot {
            0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Input area */
        .input-area {
            background: var(--bg2);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            flex-shrink: 0;
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .input-box {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 44px;
            max-height: 200px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-box:focus {
            border-color: var(--accent);
        }

        .send-btn {
            background: var(--accent);
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover { background: var(--accent2); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Side panel */
        .side-panel {
            position: fixed;
            right: -400px;
            top: 0;
            bottom: 0;
            width: 380px;
            background: var(--bg2);
            border-left: 1px solid var(--border);
            transition: right 0.3s ease;
            z-index: 100;
            overflow-y: auto;
            padding: 20px;
        }

        .side-panel.open { right: 0; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .panel-header h3 { font-size: 16px; }

        .panel-close {
            background: none;
            border: none;
            color: var(--text2);
            font-size: 20px;
            cursor: pointer;
        }

        .panel-section {
            margin-bottom: 16px;
        }

        .panel-section h4 {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text2);
            margin-bottom: 8px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
        }

        .stat-value {
            color: var(--accent);
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header { padding: 10px 12px; }
            .chat-container { padding: 12px; }
            .input-area { padding: 12px; }
            .bubble { max-width: 95%; }
            .side-panel { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <span class="logo">JARVIS</span>
            <span class="status-badge" id="statusBadge">Connecting...</span>
        </div>
        <div class="header-right">
            <button class="header-btn" onclick="showPanel('status')">Status</button>
            <button class="header-btn" onclick="showPanel('skills')">Skills</button>
            <button class="header-btn" onclick="sendCommand('reset')">Reset</button>
        </div>
    </div>

    <!-- Chat area -->
    <div class="chat-container" id="chatContainer">
        <div class="message assistant">
            <div class="avatar jarvis">J</div>
            <div class="bubble">
                Xin chao! Toi la <strong>JARVIS</strong> — tro ly AI ca nhan cua ban.<br>
                Hay hoi toi bat cu dieu gi.
            </div>
        </div>
    </div>

    <!-- Thinking indicator -->
    <div class="thinking" id="thinking" style="display: none;">
        <div class="thinking-dots">
            <span></span><span></span><span></span>
        </div>
        <span>JARVIS dang suy nghi...</span>
    </div>

    <!-- Input -->
    <div class="input-area">
        <div class="input-wrapper">
            <textarea class="input-box" id="inputBox"
                placeholder="Nhap tin nhan..."
                rows="1"
                onkeydown="handleKeyDown(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                &#10148;
            </button>
        </div>
    </div>

    <!-- Side panel -->
    <div class="side-panel" id="sidePanel">
        <div class="panel-header">
            <h3 id="panelTitle">Status</h3>
            <button class="panel-close" onclick="closePanel()">&times;</button>
        </div>
        <div id="panelContent"></div>
    </div>

    <script>
        // --- State ---
        let ws = null;
        let isConnected = false;
        let messageId = 0;

        // --- WebSocket ---
        function connect() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/ws/chat`);

            ws.onopen = () => {
                isConnected = true;
                document.getElementById('statusBadge').textContent = 'Online';
                document.getElementById('statusBadge').style.color = 'var(--green)';
                document.getElementById('statusBadge').style.background = 'rgba(74, 222, 128, 0.15)';
            };

            ws.onclose = () => {
                isConnected = false;
                document.getElementById('statusBadge').textContent = 'Offline';
                document.getElementById('statusBadge').style.color = 'var(--red)';
                document.getElementById('statusBadge').style.background = 'rgba(248, 113, 113, 0.15)';
                // Auto-reconnect after 3s
                setTimeout(connect, 3000);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleEvent(data);
            };

            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
            };
        }

        function handleEvent(data) {
            switch (data.type) {
                case 'thinking':
                    document.getElementById('thinking').style.display = 'flex';
                    break;

                case 'response':
                    document.getElementById('thinking').style.display = 'none';
                    addMessage('assistant', data.text, data);
                    break;

                case 'error':
                    document.getElementById('thinking').style.display = 'none';
                    addMessage('assistant', data.text, { error: true });
                    break;

                case 'command_result':
                    renderPanelData(data.data);
                    break;
            }
        }

        // --- Messages ---
        function sendMessage() {
            const input = document.getElementById('inputBox');
            const text = input.value.trim();
            if (!text || !isConnected) return;

            addMessage('user', text);
            ws.send(JSON.stringify({ type: 'message', text: text }));
            input.value = '';
            input.style.height = 'auto';
            document.getElementById('sendBtn').disabled = true;
            setTimeout(() => { document.getElementById('sendBtn').disabled = false; }, 500);
        }

        function addMessage(role, text, meta = {}) {
            const container = document.getElementById('chatContainer');
            const id = `msg-${++messageId}`;

            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.id = id;

            const avatar = document.createElement('div');
            avatar.className = `avatar ${role === 'user' ? 'user' : 'jarvis'}`;
            avatar.textContent = role === 'user' ? 'B' : 'J';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            if (role === 'assistant') {
                bubble.innerHTML = renderMarkdown(text);

                // Tools used
                if (meta.tools_used && meta.tools_used.length > 0) {
                    const toolsDiv = document.createElement('div');
                    toolsDiv.className = 'tools-used';
                    meta.tools_used.forEach(t => {
                        const badge = document.createElement('span');
                        badge.className = 'tool-badge';
                        const icon = t.success ? '' : '';
                        badge.textContent = `${icon} ${t.tool}`;
                        toolsDiv.appendChild(badge);
                    });
                    bubble.appendChild(toolsDiv);
                }

                // Meta info
                if (meta.model || meta.latency_ms) {
                    const metaDiv = document.createElement('div');
                    metaDiv.className = 'meta';
                    const parts = [];
                    if (meta.model) parts.push(meta.model);
                    if (meta.latency_ms) parts.push(`${meta.latency_ms}ms`);
                    if (meta.cost) parts.push(meta.cost);
                    metaDiv.innerHTML = parts.join(' | ');

                    // Feedback buttons
                    const feedback = document.createElement('span');
                    feedback.className = 'feedback';
                    feedback.innerHTML = `
                        <button class="feedback-btn" onclick="sendFeedback('${id}', 'positive', this)" title="Good">&#128077;</button>
                        <button class="feedback-btn" onclick="sendFeedback('${id}', 'negative', this)" title="Bad">&#128078;</button>
                    `;
                    metaDiv.appendChild(feedback);
                    bubble.appendChild(metaDiv);
                }
            } else {
                bubble.textContent = text;
            }

            div.appendChild(avatar);
            div.appendChild(bubble);
            container.appendChild(div);

            // Add copy buttons to code blocks
            bubble.querySelectorAll('pre').forEach(pre => {
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = 'Copy';
                btn.onclick = () => {
                    const code = pre.querySelector('code');
                    navigator.clipboard.writeText(code?.textContent || pre.textContent);
                    btn.textContent = 'Copied!';
                    setTimeout(() => btn.textContent = 'Copy', 1500);
                };
                pre.style.position = 'relative';
                pre.appendChild(btn);
            });

            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        function sendFeedback(msgId, rating, btn) {
            if (ws && isConnected) {
                ws.send(JSON.stringify({
                    type: 'feedback',
                    message_id: msgId,
                    rating: rating,
                }));
                // Visual feedback
                btn.classList.add('active');
                btn.parentElement.querySelectorAll('.feedback-btn').forEach(b => {
                    if (b !== btn) b.style.display = 'none';
                });
            }
        }

        // --- Markdown renderer (lightweight) ---
        function renderMarkdown(text) {
            if (!text) return '';

            // Escape HTML
            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            // Code blocks (```lang\n...\n```)
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
                return `<pre><code class="lang-${lang || 'text'}">${code.trim()}</code></pre>`;
            });

            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Bold
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

            // Italic
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

            // Headers
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

            // Blockquotes
            html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

            // Unordered lists
            html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');

            // Links
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

            // Tables (simple)
            html = html.replace(/^\|(.+)\|$/gm, (match) => {
                const cells = match.split('|').filter(c => c.trim());
                if (cells.every(c => /^[\s-:]+$/.test(c))) return ''; // separator row
                const tag = match.includes('---') ? 'td' : 'td';
                const row = cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('');
                return `<tr>${row}</tr>`;
            });
            html = html.replace(/(<tr>.*<\/tr>\n?)+/g, '<table>$&</table>');

            // Paragraphs (double newlines)
            html = html.replace(/\n\n/g, '</p><p>');
            html = html.replace(/\n/g, '<br>');

            // Clean up empty tags
            html = html.replace(/<p><\/p>/g, '');
            html = html.replace(/<br><(h[123]|ul|pre|blockquote|table)/g, '<$1');
            html = html.replace(/<\/(h[123]|ul|pre|blockquote|table)><br>/g, '</$1>');

            return html;
        }

        // --- Input handling ---
        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // Auto-resize textarea
        document.getElementById('inputBox').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        // --- Side panel ---
        function showPanel(type) {
            document.getElementById('sidePanel').classList.add('open');
            document.getElementById('panelTitle').textContent =
                type === 'status' ? 'System Status' :
                type === 'skills' ? 'Skills' : type;
            document.getElementById('panelContent').innerHTML = '<p style="color:var(--text2)">Loading...</p>';
            sendCommand(type);
        }

        function closePanel() {
            document.getElementById('sidePanel').classList.remove('open');
        }

        function sendCommand(cmd) {
            if (ws && isConnected) {
                ws.send(JSON.stringify({ type: 'command', command: cmd }));
            }
        }

        function renderPanelData(data) {
            const content = document.getElementById('panelContent');

            if (data.message) {
                content.innerHTML = `<p style="color:var(--green)">${data.message}</p>`;
                return;
            }

            if (data.error) {
                content.innerHTML = `<p style="color:var(--red)">${data.error}</p>`;
                return;
            }

            // Status panel
            if (data.status) {
                content.innerHTML = `
                    <div class="panel-section">
                        <h4>System</h4>
                        <div class="stat-row"><span>Status</span><span class="stat-value">${data.status}</span></div>
                        <div class="stat-row"><span>Version</span><span class="stat-value">${data.version}</span></div>
                        <div class="stat-row"><span>Skills</span><span class="stat-value">${data.skills}</span></div>
                        <div class="stat-row"><span>Tools</span><span class="stat-value">${data.tools}</span></div>
                    </div>
                    <div class="panel-section">
                        <h4>Models</h4>
                        <div class="stat-row"><span>Local</span><span class="stat-value">${data.local_model || 'N/A'}</span></div>
                        <div class="stat-row"><span>Cloud</span><span class="stat-value">${data.cloud_model || 'N/A'}</span></div>
                        <div class="stat-row"><span>Local Enabled</span><span class="stat-value">${data.local_enabled ? 'Yes' : 'No'}</span></div>
                    </div>
                    <div class="panel-section">
                        <h4>Metrics</h4>
                        <div class="stat-row"><span>Total Calls</span><span class="stat-value">${data.total_calls}</span></div>
                        <div class="stat-row"><span>Local Ratio</span><span class="stat-value">${data.local_ratio}</span></div>
                        <div class="stat-row"><span>Total Cost</span><span class="stat-value">${data.total_cost}</span></div>
                        <div class="stat-row"><span>Cache</span><span class="stat-value">${data.cache_entries} entries</span></div>
                    </div>
                `;
                return;
            }

            // Skills panel
            if (data.skills) {
                let html = '<div class="panel-section"><h4>Loaded Skills</h4>';
                data.skills.forEach(s => {
                    const rate = Math.round(s.success_rate * 100);
                    html += `
                        <div style="padding: 8px 0; border-bottom: 1px solid var(--border);">
                            <div style="display: flex; justify-content: space-between;">
                                <span>${s.emoji} <strong>${s.name}</strong></span>
                                <span style="font-size:11px; color:var(--text2)">v${s.version}</span>
                            </div>
                            <div style="font-size:12px; color:var(--text2); margin-top:2px;">${s.description}</div>
                            <div style="font-size:11px; color:var(--text2); margin-top:4px;">
                                Success: ${rate}% | Uses: ${s.usage_count} | Priority: ${s.priority.toFixed(2)}
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                content.innerHTML = html;
                return;
            }

            // Health checks
            if (data.checks) {
                let html = '<div class="panel-section"><h4>Health Checks</h4>';
                data.checks.forEach(c => {
                    const icon = c.status === 'healthy' ? '&#9989;' :
                                 c.status === 'degraded' ? '&#9888;' : '&#10060;';
                    html += `
                        <div class="stat-row">
                            <span>${icon} ${c.name}</span>
                            <span style="font-size:11px; color:var(--text2)">${c.latency_ms}ms</span>
                        </div>
                    `;
                });
                html += '</div>';
                content.innerHTML = html;
                return;
            }

            // Memories
            if (data.memories) {
                let html = '<div class="panel-section"><h4>Recent Memories</h4>';
                data.memories.forEach(m => {
                    html += `
                        <div style="padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px;">
                            <span>${m.content}</span>
                            <span style="font-size:10px; color:var(--text2); display:block; margin-top:2px;">${m.category}</span>
                        </div>
                    `;
                });
                html += '</div>';
                content.innerHTML = html;
                return;
            }

            // Generic
            content.innerHTML = `<pre style="font-size:12px; color:var(--text2)">${JSON.stringify(data, null, 2)}</pre>`;
        }

        // --- Init ---
        connect();
        document.getElementById('inputBox').focus();
    </script>
</body>
</html>
